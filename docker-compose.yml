services:
  html-workbench-init:
    build: .
    image: html-workbench:local
    container_name: html-workbench-init
    user: root
    entrypoint: ["chown"]
    command: ["-R", "node:node", "/data"]
    restart: "no"
    volumes:
      - html-workbench-data:/data

  migration:
    image: html-workbench:local
    container_name: html-workbench-migration
    restart: "no"
    depends_on:
      html-workbench-init:
        condition: service_completed_successfully
    command: ["npm", "run", "migrate:record-index"]
    environment:
      NODE_ENV: production
      HTML_WORKBENCH_ROLE: admin
      HTML_WORKBENCH_DATA_DIR: /data
      HTML_WORKBENCH_ADMIN_ORIGIN: https://desk.wekkii.cn
      HTML_WORKBENCH_PUBLIC_ORIGIN: https://ho.wekkii.cn
      HTML_WORKBENCH_PASSWORD: "${HTML_WORKBENCH_PASSWORD:?HTML_WORKBENCH_PASSWORD is required}"
      HTML_WORKBENCH_AUTH_SECRET: "${HTML_WORKBENCH_AUTH_SECRET:?HTML_WORKBENCH_AUTH_SECRET is required}"
      HTML_WORKBENCH_DOWNLOAD_PASSWORD: "${HTML_WORKBENCH_DOWNLOAD_PASSWORD:?HTML_WORKBENCH_DOWNLOAD_PASSWORD is required}"
      HTML_WORKBENCH_CURSOR_SECRET: "${HTML_WORKBENCH_CURSOR_SECRET:?HTML_WORKBENCH_CURSOR_SECRET is required}"
    volumes:
      - html-workbench-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  admin:
    image: html-workbench:local
    container_name: html-workbench
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HTML_WORKBENCH_ROLE: admin
      HOST: 0.0.0.0
      PORT: 3000
      HEALTHCHECK_HOST: desk.wekkii.cn
      HTML_WORKBENCH_DATA_DIR: /data
      HTML_WORKBENCH_ADMIN_ORIGIN: https://desk.wekkii.cn
      HTML_WORKBENCH_PUBLIC_ORIGIN: https://ho.wekkii.cn
      HTML_WORKBENCH_PASSWORD: "${HTML_WORKBENCH_PASSWORD:?HTML_WORKBENCH_PASSWORD is required}"
      HTML_WORKBENCH_AUTH_SECRET: "${HTML_WORKBENCH_AUTH_SECRET:?HTML_WORKBENCH_AUTH_SECRET is required}"
      HTML_WORKBENCH_DOWNLOAD_PASSWORD: "${HTML_WORKBENCH_DOWNLOAD_PASSWORD:?HTML_WORKBENCH_DOWNLOAD_PASSWORD is required}"
      HTML_WORKBENCH_CURSOR_SECRET: "${HTML_WORKBENCH_CURSOR_SECRET:?HTML_WORKBENCH_CURSOR_SECRET is required}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - html-workbench-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({hostname:'127.0.0.1',path:'/healthz',port:3000,headers:{Host:'desk.wekkii.cn'}},(response)=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  content:
    image: html-workbench:local
    container_name: html-workbench-content
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HTML_WORKBENCH_ROLE: content
      HOST: 0.0.0.0
      PORT: 3001
      HEALTHCHECK_HOST: ho.wekkii.cn
      HTML_WORKBENCH_DATA_DIR: /data
      HTML_WORKBENCH_ADMIN_ORIGIN: https://desk.wekkii.cn
      HTML_WORKBENCH_PUBLIC_ORIGIN: https://ho.wekkii.cn
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - html-workbench-data:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get({hostname:'127.0.0.1',path:'/healthz',port:3001,headers:{Host:'ho.wekkii.cn'}},(response)=>process.exit(response.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  html-workbench-data:
