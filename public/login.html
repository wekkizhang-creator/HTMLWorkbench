<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问验证 - HTML 发布台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="panel login-panel" aria-labelledby="loginTitle">
        <div class="brand login-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7 4h13l5 5v19H7z" fill="#f7faf9" stroke="#17211f" stroke-width="1.6"/>
              <path d="M20 4v6h5" fill="none" stroke="#17211f" stroke-width="1.6"/>
              <path d="m13.2 15.4-3.1 3.1 3.1 3.1M18.8 15.4l3.1 3.1-3.1 3.1M16.9 14.7l-2 7.6" fill="none" stroke="#1f9d85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div>
            <h1 id="loginTitle">HTML 发布台</h1>
            <p>请输入访问密码</p>
          </div>
        </div>
        <form class="login-form" id="loginForm">
          <label>
            <span>访问密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" inputmode="numeric" autofocus>
          </label>
          <button class="button primary" id="loginButton" type="submit">进入</button>
        </form>
        <p class="login-error" id="loginError" role="alert"></p>
      </section>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const input = document.querySelector("#passwordInput");
      const button = document.querySelector("#loginButton");
      const errorText = document.querySelector("#loginError");
      const rawNext = new URLSearchParams(window.location.search).get("next") || "/";
      const next = rawNext.startsWith("/") && !rawNext.startsWith("//") ? rawNext : "/";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorText.textContent = "";
        button.disabled = true;
        button.textContent = "验证中";
        try {
          const response = await fetch("/api/auth", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password: input.value })
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || "密码不正确");
          }
          window.location.href = next;
        } catch (error) {
          errorText.textContent = error.message;
          button.disabled = false;
          button.textContent = "进入";
          input.focus();
          input.select();
        }
      });
    </script>
  </body>
</html>
