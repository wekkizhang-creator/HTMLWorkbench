<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>PinShot 截贴 · PC 截图工具原型</title>
    <link rel="stylesheet" href="/pinshot/styles.css">
  </head>
  <body>
    <main id="pinshotApp" class="pinshot-app" data-mode="idle">
      <section id="desktopScene" class="desktop-scene" aria-label="模拟桌面">
        <div class="desktop-wallpaper" aria-hidden="true"></div>
        <article class="mock-window mock-window--notes" data-window-candidate="notes">
          <header><span>项目备忘</span><span aria-hidden="true">— □ ×</span></header>
          <h1>发布前检查</h1>
          <p>确认首页文案、快捷键与导出流程。</p>
        </article>
        <article class="mock-window mock-window--browser" data-window-candidate="browser">
          <header><span>设计评审</span><span aria-hidden="true">— □ ×</span></header>
          <div class="browser-card"><strong>PinShot</strong><span>更轻、更快的截图与贴图体验</span></div>
        </article>

        <div id="pinLayer" class="pin-layer" aria-label="桌面贴图"></div>
        <div id="captureOverlay" class="capture-overlay" hidden>
          <div id="selectionBox" class="selection-box" hidden>
            <span data-handle="nw" aria-hidden="true"></span><span data-handle="n" aria-hidden="true"></span>
            <span data-handle="ne" aria-hidden="true"></span><span data-handle="e" aria-hidden="true"></span>
            <span data-handle="se" aria-hidden="true"></span><span data-handle="s" aria-hidden="true"></span>
            <span data-handle="sw" aria-hidden="true"></span><span data-handle="w" aria-hidden="true"></span>
          </div>
          <canvas id="annotationCanvas" aria-label="截图标注画布"></canvas>
          <output id="selectionSize" class="selection-size" hidden></output>
          <div id="magnifier" class="magnifier" hidden aria-hidden="true"></div>
          <div id="annotationToolbar" class="annotation-toolbar" role="toolbar" aria-label="截图标注工具" hidden>
            <button type="button" data-icon-only data-tool="select" title="选择 V" aria-label="选择" aria-pressed="true">选择</button>
            <button type="button" data-icon-only data-tool="rectangle" title="矩形 R" aria-label="矩形" aria-pressed="false">矩形</button>
            <button type="button" data-icon-only data-tool="arrow" title="箭头 A" aria-label="箭头" aria-pressed="false">箭头</button>
            <button type="button" data-icon-only data-tool="pen" title="画笔 P" aria-label="画笔" aria-pressed="false">画笔</button>
            <button type="button" data-icon-only data-tool="highlight" title="荧光笔 H" aria-label="荧光笔" aria-pressed="false">荧光笔</button>
            <button type="button" data-icon-only data-tool="text" title="文字 T" aria-label="文字" aria-pressed="false">文字</button>
            <button type="button" data-icon-only data-tool="number" title="序号 N" aria-label="序号" aria-pressed="false">序号</button>
            <button type="button" data-icon-only data-tool="mosaic" title="马赛克 M" aria-label="马赛克" aria-pressed="false">马赛克</button>
            <button type="button" data-tool="color" title="取色 I" aria-label="取色" aria-pressed="false">取色</button>
            <span class="toolbar-separator" role="separator" aria-orientation="vertical"></span>
            <button type="button" data-command="undo" title="撤销 Ctrl+Z" aria-label="撤销">撤销</button>
            <button type="button" data-command="redo" title="重做 Ctrl+Shift+Z" aria-label="重做">重做</button>
            <button type="button" data-command="copy" title="复制 Enter" aria-label="复制">复制</button>
            <button type="button" data-command="save" title="保存 Ctrl+S" aria-label="保存">保存</button>
            <button type="button" data-command="pin" title="贴图 F3" aria-label="贴图">贴图</button>
            <button type="button" data-command="complete" title="完成 Esc" aria-label="完成">完成</button>
          </div>
        </div>

        <aside id="historyStrip" class="history-strip" aria-label="最近截图" hidden></aside>
        <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
          <header class="settings-header"><div><h1 id="settingsTitle">PinShot 设置</h1><p>浏览器原型偏好设置</p></div><button type="button" data-settings-close data-icon-only aria-label="关闭设置">×</button></header>
          <div class="settings-layout"><nav class="settings-nav" aria-label="设置分类"><button type="button" data-settings-section="general" aria-current="page">通用</button><button type="button" data-settings-section="capture" aria-current="false">截图</button><button type="button" data-settings-section="annotation" aria-current="false">标注</button><button type="button" data-settings-section="pin" aria-current="false">贴图</button><button type="button" data-settings-section="shortcuts" aria-current="false">快捷键</button><button type="button" data-settings-section="output" aria-current="false">输出</button></nav>
            <section class="settings-panel" data-settings-panel="general"><h2 tabindex="-1">通用</h2><p class="settings-simulated">启动、备份、日志与配置位置仅为浏览器原型模拟偏好。</p><label>主题<select data-setting="theme"><option value="dark">深色</option><option value="light">浅色</option></select></label><label>语言<select data-setting="locale"><option value="zh-CN">简体中文</option></select></label><label><input type="checkbox" data-setting="launchAtStartup"> 开机启动（模拟）</label><label><input type="checkbox" data-setting="autoBackup"> 自动备份（模拟）</label><label><input type="checkbox" data-setting="quickResponse"> 快速响应</label><label><input type="checkbox" data-setting="enhancedContextMenu"> 增强右键菜单</label><label>日志级别（模拟）<select data-setting="logLevel"><option value="normal">普通</option><option value="debug">调试</option></select></label><label>配置位置（模拟）<input data-setting="configLocation" readonly></label><div class="settings-preview">实时主题预览</div><button type="button" data-reset-group>恢复本组默认</button></section>
            <section class="settings-panel" data-settings-panel="capture" hidden><h2 tabindex="-1">截图</h2><label><input type="checkbox" data-setting="showBorder"> 显示选区边框</label><label><input type="checkbox" data-setting="showMask"> 显示遮罩</label><label><input type="checkbox" data-setting="showHandles"> 显示控制点</label><label><input type="checkbox" data-setting="showMagnifierMask"> 放大镜遮罩</label><label><input type="checkbox" data-setting="showMagnifierBorder"> 放大镜边框</label><label><input type="checkbox" data-setting="showMagnifierAnchor"> 放大镜锚点</label><label><input type="checkbox" data-setting="showCrosshair"> 十字线</label><label><input type="checkbox" data-setting="showShortcutHints"> 显示快捷提示</label><label>边框宽度<input type="number" min="1" max="8" data-setting="borderWidth"></label><label>遮罩不透明度<input type="number" min="10" max="85" data-setting="maskOpacity"></label><div class="settings-preview">实时截图预览</div><button type="button" data-reset-group>恢复本组默认</button></section>
            <section class="settings-panel" data-settings-panel="annotation" hidden><h2 tabindex="-1">标注</h2><label>标注颜色<input type="color" data-setting="annotationColor"></label><label>线条宽度<input type="number" min="1" max="16" data-setting="annotationWidth"></label><label>字体大小<input type="number" min="12" max="72" data-setting="annotationFontSize"></label><div class="settings-preview">实时标注预览</div><button type="button" data-reset-group>恢复本组默认</button></section>
            <section class="settings-panel" data-settings-panel="pin" hidden><h2 tabindex="-1">贴图</h2><label><input type="checkbox" data-setting="pinShadow"> 显示贴图阴影</label><label>贴图不透明度<input type="number" min="10" max="100" data-setting="pinOpacity"></label><label>最大贴图尺寸<input type="number" data-setting="pinMaxSize"></label><label>缩略图宽度<input type="number" data-setting="thumbnailWidth"></label><label>缩略图高度<input type="number" data-setting="thumbnailHeight"></label><label>滚轮动作<select data-setting="mouseActions.pinScale"><option>Wheel</option></select></label><label>透明度动作<select data-setting="mouseActions.pinOpacity"><option>Ctrl+Wheel</option></select></label><label>关闭动作<select data-setting="mouseActions.closePin"><option>DoubleClick</option><option>RightClick</option></select></label><label>重置动作<select data-setting="mouseActions.resetPin"><option>MiddleClick</option></select></label><label>缩略图动作<select data-setting="mouseActions.quickThumbnail"><option>Shift+DoubleClick</option></select></label><label>复制文字动作<select data-setting="mouseActions.copyText"><option>Shift+RightClick</option></select></label><div class="settings-preview">实时贴图预览</div><button type="button" data-reset-group>恢复本组默认</button></section>
            <section class="settings-panel" data-settings-panel="shortcuts" hidden><h2 tabindex="-1">快捷键</h2><p class="settings-simulated">仅在此浏览器原型页面内记录，不注册系统全局快捷键。</p><label>开始截图<input readonly data-shortcut-recorder data-setting="shortcuts.capture"><small data-conflict-for="capture"></small></label><label>截图并复制<input readonly data-shortcut-recorder data-setting="shortcuts.captureAndCopy"><small data-conflict-for="captureAndCopy"></small></label><label>自定义截图<input readonly data-shortcut-recorder data-setting="shortcuts.customCapture"><small data-conflict-for="customCapture"></small></label><label>贴图<input readonly data-shortcut-recorder data-setting="shortcuts.paste"><small data-conflict-for="paste"></small></label><label>显示贴图<input readonly data-shortcut-recorder data-setting="shortcuts.togglePins"><small data-conflict-for="togglePins"></small></label><label>切换贴图组<input readonly data-shortcut-recorder data-setting="shortcuts.cyclePinGroup"><small data-conflict-for="cyclePinGroup"></small></label><div class="settings-preview">实时快捷键预览</div><button type="button" data-reset-group>恢复本组默认</button></section>
            <section class="settings-panel" data-settings-panel="output" hidden><h2 tabindex="-1">输出</h2><label>输出格式<select data-setting="outputFormat"><option value="png">PNG</option><option value="jpg">JPG</option></select></label><label>输出目录<input data-setting="outputDirectory"></label><div class="settings-preview">实时输出预览</div><button type="button" data-reset-group>恢复本组默认</button></section></div>
          <footer class="settings-footer"><button type="button" data-reset-all>恢复全部默认</button></footer>
        </dialog>
        <nav id="trayMenu" class="tray-menu" aria-label="PinShot 托盘菜单" hidden></nav>
      </section>

      <button id="captureLauncher" class="capture-launcher" type="button" title="开始截图 F1">
        <span aria-hidden="true">⌗</span><span>开始截图</span><kbd>F1</kbd>
      </button>
      <button id="trayLauncher" class="tray-launcher" type="button" aria-label="打开 PinShot 托盘菜单" title="打开托盘菜单">P</button>
      <p class="prototype-notice">这是交互原型，不会读取真实系统屏幕、注册全局快捷键或创建原生置顶窗口。</p>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/pinshot/app.mjs"></script>
  </body>
</html>
