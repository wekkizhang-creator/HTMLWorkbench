<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML 发布台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7 4h13l5 5v19H7z" fill="#f7faf9" stroke="#17211f" stroke-width="1.6"/>
              <path d="M20 4v6h5" fill="none" stroke="#17211f" stroke-width="1.6"/>
              <path d="m13.2 15.4-3.1 3.1 3.1 3.1M18.8 15.4l3.1 3.1-3.1 3.1M16.9 14.7l-2 7.6" fill="none" stroke="#1f9d85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div>
            <h1>HTML 发布台</h1>
            <p id="originText">localhost</p>
          </div>
        </div>
        <div class="topbar-tools">
          <div class="metric-strip" aria-label="上传概览">
            <div>
              <span id="totalCount">0</span>
              <small>已发布</small>
            </div>
            <div>
              <span id="latestTime">--</span>
              <small>最新上传</small>
            </div>
          </div>
          <button class="icon-button" id="logoutButton" type="button" aria-label="退出登录" title="退出登录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17 5 12l5-5M5 12h11M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel upload-panel" aria-labelledby="uploadTitle">
          <div class="section-title">
            <h2 id="uploadTitle">发布 HTML</h2>
            <span class="status-pill" id="uploadStatus">待选择</span>
          </div>

          <form id="uploadForm" class="upload-form">
            <label class="dropzone" id="dropzone" for="fileInput">
              <input id="fileInput" name="file" type="file" accept=".html,.htm,text/html" hidden>
              <span class="drop-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 15V3m0 0 4 4m-4-4-4 4M5 15v4h14v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="drop-copy">
                <strong id="fileName">选择 HTML 文件</strong>
                <span id="fileDetail">.html / .htm，最大 4 MB</span>
              </span>
            </label>

            <div class="upload-meta-grid">
              <label class="field-control" for="documentTypeSelect">
                <span>文档类型</span>
                <select id="documentTypeSelect" name="documentType">
                  <option value="分析报告">分析报告</option>
                  <option value="原型">原型</option>
                  <option value="其他">其他</option>
                  <option value="__custom">新建类型</option>
                </select>
              </label>
              <label class="field-control custom-type-input" for="documentTypeCustom" hidden>
                <span>新类型</span>
                <input id="documentTypeCustom" type="text" maxlength="24" placeholder="输入新类型">
              </label>
            </div>

            <div class="button-row">
              <button class="button primary" id="uploadButton" type="submit" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3v12m0-12 4 4m-4-4-4 4M5 15v4h14v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                发布
              </button>
              <button class="button secondary" id="clearButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                清空
              </button>
            </div>
          </form>
        </section>

        <section class="panel result-panel" aria-labelledby="resultTitle">
          <div class="section-title">
            <h2 id="resultTitle">生成链接</h2>
            <span class="status-pill ready" id="linkStatus">等待上传</span>
          </div>
          <div class="link-preview">
            <a id="latestLink" href="#" target="_blank" rel="noopener">--</a>
          </div>
          <div class="button-row">
            <button class="button secondary" id="copyLatestButton" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M5 15H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h9a1 1 0 0 1 1 1v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              复制
            </button>
            <a class="button secondary disabled" id="openLatestButton" href="#" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 4h6v6M10 14 20 4M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              打开
            </a>
          </div>
        </section>

        <section class="panel records-panel" aria-labelledby="recordsTitle">
          <div class="section-title records-title">
            <h2 id="recordsTitle">上传记录</h2>
            <button class="icon-button" id="refreshButton" type="button" aria-label="刷新记录" title="刷新记录">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <div class="record-tools">
            <label class="search-box">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <input id="searchInput" type="search" placeholder="搜索标题或描述">
            </label>
            <label class="type-filter" for="typeFilter">
              <span>类型</span>
              <select id="typeFilter">
                <option value="">全部类型</option>
              </select>
            </label>
            <div class="tag-filter" id="tagFilter" aria-label="标签筛选"></div>
          </div>

          <div class="table-frame">
            <table>
              <thead>
                <tr>
                  <th>文件</th>
                  <th>标题与描述</th>
                  <th>文档类型</th>
                  <th>标签</th>
                  <th>上传时间</th>
                  <th>大小</th>
                  <th>访问链接</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="recordBody"></tbody>
            </table>
            <div class="empty-state" id="emptyState">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M13 8h16l6 6v26H13z" fill="#f3f6f4" stroke="#7c8985" stroke-width="1.8"/>
                <path d="M29 8v7h6M18 24h12M18 30h8" fill="none" stroke="#1f9d85" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <span id="emptyText">暂无记录</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
