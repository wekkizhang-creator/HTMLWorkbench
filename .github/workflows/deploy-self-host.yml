name: Deploy self-hosted HTMLWorkbench

on:
  push:
    branches:
      - owncnd_codex/html
  workflow_dispatch:

concurrency:
  group: self-hosted-html-workbench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
      APP_DIR: ${{ vars.SERVER_APP_DIR || '/opt/html-workbench' }}
      REPO_URL: ${{ vars.SERVER_REPO_URL || 'https://github.com/wekkizhang-creator/HTMLWorkbench.git' }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Require deployment secrets
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_HOST_KEY; do
            [ -n "${!name:-}" ] || { echo "$name is required for deployment" >&2; exit 1; }
          done
      - name: Check out the triggering release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          [ "$APP_DIR" = "/opt/html-workbench" ] || { echo "SERVER_APP_DIR must be /opt/html-workbench" >&2; exit 1; }
          case "$SERVER_HOST" in *[!A-Za-z0-9.:-]*|'') echo "SERVER_HOST contains unsafe characters" >&2; exit 1 ;; esac
          case "$SERVER_USER" in *[!A-Za-z0-9._-]*|'') echo "SERVER_USER contains unsafe characters" >&2; exit 1 ;; esac
          case "$SERVER_PORT" in *[!0-9]*|'') echo "SERVER_PORT must be numeric" >&2; exit 1 ;; esac
          [ "$SERVER_PORT" -ge 1 ] && [ "$SERVER_PORT" -le 65535 ] || { echo "SERVER_PORT is out of range" >&2; exit 1; }
          case "$DEPLOY_SHA" in *[!0-9a-fA-F]*|'') echo "DEPLOY_SHA must be hexadecimal" >&2; exit 1 ;; esac
          [ "${#DEPLOY_SHA}" -eq 40 ] || { echo "DEPLOY_SHA must contain 40 characters" >&2; exit 1; }
          case "$REPO_URL" in *[!A-Za-z0-9._~:/@%+=,-]*) echo "SERVER_REPO_URL contains unsafe characters" >&2; exit 1 ;; esac
          case "$REPO_URL" in https://github.com/*) ;; *) echo "SERVER_REPO_URL must be an HTTPS GitHub URL" >&2; exit 1 ;; esac
          [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ] || { echo "Checkout does not match DEPLOY_SHA" >&2; exit 1; }

      - name: Configure pinned SSH trust
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/htmlworkbench_deploy_key
          chmod 600 ~/.ssh/htmlworkbench_deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/htmlworkbench_known_hosts
          chmod 600 ~/.ssh/htmlworkbench_known_hosts
          expected_host="$SERVER_HOST"
          if [ "$SERVER_PORT" != "22" ]; then expected_host="[$SERVER_HOST]:$SERVER_PORT"; fi
          awk -v expected="$expected_host" 'NF >= 3 && $1 == expected { found=1 } END { exit(found ? 0 : 1) }' ~/.ssh/htmlworkbench_known_hosts || {
            echo "SERVER_HOST_KEY must contain an out-of-band known_hosts entry for $expected_host" >&2
            exit 1
          }
          ssh-keygen -lf ~/.ssh/htmlworkbench_known_hosts >/dev/null

      - name: Package immutable deployment entrypoint
        run: tar -czf "html-workbench-deploy-${DEPLOY_SHA}.tar.gz" deploy/self-host

      - name: Deploy exact release on server
        run: |
          set -euo pipefail
          archive="html-workbench-deploy-${DEPLOY_SHA}.tar.gz"
          remote_archive="/tmp/${archive}"
          ssh_options=(
            -i "$HOME/.ssh/htmlworkbench_deploy_key"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/htmlworkbench_known_hosts"
          )
          scp -P "$SERVER_PORT" "${ssh_options[@]}" "$archive" "$SERVER_USER@$SERVER_HOST:$remote_archive"
          ssh -p "$SERVER_PORT" "${ssh_options[@]}" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_DIR='$APP_DIR' REPO_URL='$REPO_URL' DEPLOY_ARCHIVE='$remote_archive' bash -s" <<'REMOTE'
          set -euo pipefail
          case "$DEPLOY_SHA" in *[!0-9a-fA-F]*|'') exit 1 ;; esac
          [ "${#DEPLOY_SHA}" -eq 40 ] || exit 1
          work_dir="$(mktemp -d "/tmp/html-workbench-deploy-${DEPLOY_SHA}.XXXXXX")"
          trap 'rm -rf -- "$work_dir" "$DEPLOY_ARCHIVE"' EXIT
          tar -xzf "$DEPLOY_ARCHIVE" -C "$work_dir"
          chmod 755 "$work_dir/deploy/self-host/deploy.sh"
          env APP_DIR="$APP_DIR" REPO_URL="$REPO_URL" DEPLOY_SHA="$DEPLOY_SHA" \
            bash "$work_dir/deploy/self-host/deploy.sh"
          REMOTE
