name: Deploy self-hosted HTMLWorkbench

on:
  push:
    branches:
      - owncnd_codex/html
  workflow_dispatch:

concurrency:
  group: self-hosted-html-workbench
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_USER != '' && secrets.SERVER_SSH_KEY != '' }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      APP_DIR: ${{ vars.SERVER_APP_DIR || '/opt/html-workbench' }}
      BRANCH: ${{ vars.SERVER_BRANCH || 'owncnd_codex/html' }}
      REPO_URL: ${{ vars.SERVER_REPO_URL || 'https://github.com/wekkizhang-creator/HTMLWorkbench.git' }}

    steps:
      - name: Skip when deployment secrets are missing
        if: ${{ env.HAS_DEPLOY_SECRETS != 'true' }}
        run: |
          echo "SERVER_HOST, SERVER_USER, or SERVER_SSH_KEY is not configured."
          echo "Skipping self-hosted deployment."

      - name: Validate deployment variables
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        run: |
          set -euo pipefail
          [ "$APP_DIR" = "/opt/html-workbench" ] || { echo "SERVER_APP_DIR must be /opt/html-workbench" >&2; exit 1; }
          case "$BRANCH" in *[!A-Za-z0-9._/-]*) echo "SERVER_BRANCH contains unsafe characters" >&2; exit 1 ;; esac
          case "$REPO_URL" in *[!A-Za-z0-9._~:/@%+=,-]*) echo "SERVER_REPO_URL contains unsafe characters" >&2; exit 1 ;; esac
          case "$REPO_URL" in https://github.com/*) ;; *) echo "SERVER_REPO_URL must be an HTTPS GitHub URL" >&2; exit 1 ;; esac

      - name: Configure SSH
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/htmlworkbench_deploy_key
          chmod 600 ~/.ssh/htmlworkbench_deploy_key
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        if: ${{ env.HAS_DEPLOY_SECRETS == 'true' }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/htmlworkbench_deploy_key \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "APP_DIR='$APP_DIR' BRANCH='$BRANCH' REPO_URL='$REPO_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo -n"
          fi

          if [ -d "$APP_DIR/.git" ]; then
            $SUDO git -C "$APP_DIR" fetch origin "$BRANCH"
            $SUDO git -C "$APP_DIR" checkout "$BRANCH"
            $SUDO git -C "$APP_DIR" reset --hard "origin/$BRANCH"
          else
            $SUDO git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

          $SUDO env APP_DIR="$APP_DIR" BRANCH="$BRANCH" REPO_URL="$REPO_URL" \
            bash "$APP_DIR/deploy/self-host/deploy.sh"
          REMOTE
